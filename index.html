<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronomètre</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg text-center">
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Chronomètre</h1>
        <div id="display" class="text-5xl font-mono text-gray-700 mb-6">00:00:00</div>
        <div class="space-x-4">
            <button id="startBtn" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">Démarrer</button>
            <button id="pauseBtn" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded">Pause</button>
            <button id="resetBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded">Réinitialiser</button>
        </div>
    </div>
    <script src="/js/script.js"></script>
</body>
</html>
